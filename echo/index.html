<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#10130f">
  <title>TACTICAL RECON · PROJECT ECHOPOINT</title>
  <link rel="stylesheet" href="../vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="./echo.css">
</head>
<body>
  <main id="app" data-mode="MAP">
    <div id="map" aria-label="ECHOPOINT map"></div>
    <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div><div class="corner corner-br"></div>
    <header class="coord-hud" aria-live="polite">
      <button class="coord-line" id="posLine" type="button"><span>POS</span><strong>NO FIX</strong></button>
      <button class="coord-line" id="tgtLine" type="button"><span>TGT</span><strong>--</strong></button>
    </header>
    <div class="top-actions">
      <button id="searchBtn" class="icon-btn" type="button" aria-label="검색">⌕</button>
      <button id="moreBtn" class="icon-btn" type="button" aria-label="더보기">⋯</button>
    </div>
    <div class="reticle" aria-hidden="true"><i></i><b></b></div>
    <aside class="global-tools" aria-label="전역 도구">
      <button id="gpsBtn" class="tool-btn" type="button"><span class="tool-glyph">GPS</span><small>OFF</small></button>
      <button id="followBtn" class="tool-btn" type="button"><span class="tool-glyph">◎</span><small>추적</small></button>
      <button id="tempBtn" class="tool-btn" type="button"><span class="tool-glyph">⌖</span><small>TEMP</small></button>
      <button id="trackBtn" class="tool-btn track-off" type="button"><span class="track-dot">○</span><small>트랙</small></button>
    </aside>
    <section id="planPanel" class="plan-panel" hidden>
      <div class="section-kicker">PLAN</div>
      <div id="planList" class="plan-list"></div>
      <button id="addPointBtn" class="text-action" type="button">＋ 위치</button>
    </section>
    <section id="missionHud" class="mission-hud" hidden>
      <button id="nextInfoBtn" class="mission-info" type="button">
        <span class="section-kicker">NEXT</span><strong id="nextName">--</strong><span id="nextMetrics">-- KM · BRG ---°</span>
      </button>
      <button id="missionTimeBtn" class="mission-time" type="button"><span>MISSION</span><strong id="missionTime">00:00:00</strong></button>
    </section>
    <nav id="mapBar" class="bottom-bar" aria-label="지도 메뉴">
      <button data-main="points" type="button">⌾<span>거점</span></button>
      <button data-main="random" type="button">✣<span>무작위</span></button>
      <button data-main="records" type="button">≋<span>기록</span></button>
      <button data-main="tools" type="button">⌁<span>도구</span></button>
    </nav>
    <nav id="planBar" class="bottom-bar context-bar" hidden>
      <button id="drawBtn" type="button">✎<span>경로</span></button>
      <button id="importBtn" type="button">⇩<span>불러오기</span></button>
      <button id="missionStartBtn" class="primary" type="button">▶<span>시작</span></button>
    </nav>
    <nav id="missionBar" class="mission-nav" hidden>
      <button id="prevPointBtn" type="button" aria-label="이전 포인트">‹</button>
      <button id="pointIndexBtn" type="button">-- / --</button>
      <button id="nextPointBtn" type="button" aria-label="다음 포인트">›</button>
    </nav>
    <div id="drawTools" class="draw-tools" hidden>
      <button id="drawUndoBtn" type="button">↶</button>
      <button id="drawClearBtn" type="button">지우기</button>
      <button id="drawDoneBtn" class="primary" type="button">완료</button>
    </div>
    <section id="locationCard" class="sheet location-card" hidden>
      <button class="sheet-close" data-close="locationCard" type="button">×</button>
      <div class="section-kicker" id="locationKind">SELECTED</div>
      <h2 id="locationName">선택 위치</h2>
      <div id="locationMgrs" class="mono">--</div>
      <div id="locationDistance" class="subline">기준위치 없음</div>
      <div class="location-actions">
        <button data-loc-action="start" type="button">출발</button>
        <button data-loc-action="via" type="button">경유</button>
        <button data-loc-action="dest" class="primary" type="button">목적</button>
        <button data-loc-action="temp" type="button">TEMP</button>
        <button data-loc-action="save" type="button">저장</button>
        <button data-loc-action="remove" type="button" disabled>계획삭제</button>
      </div>
    </section>
    <section id="searchSheet" class="sheet search-sheet" hidden>
      <button class="sheet-close" data-close="searchSheet" type="button">×</button>
      <div class="section-kicker">SEARCH</div>
      <form id="searchForm">
        <input id="searchInput" autocomplete="off" placeholder="장소 · 주소 · MGRS · WGS84" aria-label="위치 검색">
        <button class="primary" type="submit">이동</button>
      </form>
      <p class="sheet-note">EP-01은 MGRS/WGS84 직접 입력부터 연결했다. 주소 검색은 다음 이식 단계에서 붙인다.</p>
    </section>
    <section id="listSheet" class="sheet list-sheet" hidden>
      <button class="sheet-close" data-close="listSheet" type="button">×</button>
      <div class="section-kicker" id="listTitle">LIST</div><div id="listContent"></div>
    </section>
    <section id="moreSheet" class="sheet compact-sheet" hidden>
      <button class="sheet-close" data-close="moreSheet" type="button">×</button>
      <div class="section-kicker">ECHOPOINT · EP-01</div>
      <button id="editMissionPlanBtn" class="menu-row" type="button">현재 계획 편집</button>
      <button id="endMissionBtn" class="menu-row danger" type="button">임무 종료</button>
    </section>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script src="../vendor/mgrs-1.0.0.js"></script>
  <script src="../vendor/leaflet-1.9.4.js"></script>
  <script src="../location-core.js"></script>
  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
