name: Compact R1.6 Low Data Basemap

on:
  push:
    branches:
      - r1.6-local-basemap-grid
    paths:
      - '.github/workflows/compact-lowdata-basemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: r1.6-local-basemap-grid

      - name: Install geometry tools
        run: sudo apt-get update && sudo apt-get install -y python3-shapely

      - name: Compact existing OSM extract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from shapely.geometry import shape, mapping

          path=Path('offline/kr-low.geojson')
          raw=json.loads(path.read_text(encoding='utf-8'))

          roads={k:[] for k in ('motorway','trunk','primary')}
          water=[]
          coast=[]
          boundary=[]
          places=[]

          for feature in raw.get('features',[]):
              p=feature.get('properties') or {}
              kind=p.get('kind')
              cls=p.get('class')
              try:
                  geom=shape(feature.get('geometry'))
              except Exception:
                  continue
              if geom.is_empty:
                  continue
              if kind=='road' and cls in roads:
                  roads[cls].append(geom)
              elif kind=='water':
                  water.append(geom)
              elif kind=='coast':
                  coast.append(geom)
              elif kind=='boundary':
                  boundary.append(geom)
              elif kind=='place':
                  places.append(feature)

          def collect_lines(geom,tolerance):
              try:
                  geom=geom.simplify(tolerance,preserve_topology=False)
              except Exception:
                  return []
              lines=[]
              def visit(g):
                  if g is None or g.is_empty:
                      return
                  if g.geom_type=='LineString':
                      coords=list(g.coords)
                      if len(coords)>=2: lines.append(coords)
                  elif g.geom_type=='MultiLineString':
                      for part in g.geoms: visit(part)
                  elif g.geom_type=='GeometryCollection':
                      for part in g.geoms: visit(part)
              visit(geom)
              return lines

          def packed_lines(kind,cls,geoms,tolerance):
              coords=[]
              for geom in geoms:
                  coords.extend(collect_lines(geom,tolerance))
              if not coords:
                  return None
              return {
                  'type':'Feature',
                  'properties':{'kind':kind,'class':cls},
                  'geometry':{'type':'MultiLineString','coordinates':coords}
              }

          out=[]
          for cls,tol in [('motorway',.0008),('trunk',.0010),('primary',.0015)]:
              feature=packed_lines('road',cls,roads[cls],tol)
              if feature is not None: out.append(feature)

          feature=packed_lines('water','river',water,.0020)
          if feature is not None: out.append(feature)
          feature=packed_lines('coast','coastline',coast,.0015)
          if feature is not None: out.append(feature)

          boundary_geometries=[]
          for geom in boundary:
              try:
                  simplified=geom.simplify(.0015,preserve_topology=True)
                  if not simplified.is_empty:
                      boundary_geometries.append(mapping(simplified))
              except Exception:
                  continue
          if boundary_geometries:
              out.append({
                  'type':'Feature',
                  'properties':{'kind':'boundary','class':'country'},
                  'geometry':{'type':'GeometryCollection','geometries':boundary_geometries}
              })

          # Keep named cities/towns. The renderer decides how many labels are visible by zoom.
          out.extend([f for f in places if (f.get('properties') or {}).get('name')])

          def quantize(v):
              if isinstance(v,float): return round(v,4)
              if isinstance(v,(list,tuple)): return [quantize(x) for x in v]
              if isinstance(v,dict): return {k:quantize(x) for k,x in v.items()}
              return v

          for feature in out:
              feature['geometry']=quantize(feature['geometry'])

          final={
              'type':'FeatureCollection',
              'name':'TACTICAL RECON South Korea Low Data Basemap',
              'source':'OpenStreetMap via Geofabrik',
              'license':'ODbL 1.0',
              'features':out
          }
          path.write_text(json.dumps(final,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          size=path.stat().st_size
          print('features',len(out))
          print('bytes',size)
          if size>9_000_000:
              raise SystemExit('compacted basemap still exceeds 9 MB')
          PY

      - name: Commit compact basemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/kr-low.geojson
          git commit -m "Compact South Korea low-data basemap"
          git push origin HEAD:r1.6-local-basemap-grid
