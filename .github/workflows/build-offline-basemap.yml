name: Build Offline Basemap

on:
  push:
    branches:
      - r1.6-offline-basemap
    paths:
      - tools/build_offline_basemap.py
      - .github/workflows/build-offline-basemap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: r1.6-offline-basemap

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install geodata tools
        run: python -m pip install --disable-pip-version-check pyshp shapely

      - name: Build South Korea low-data basemap
        run: python tools/build_offline_basemap.py

      - name: Commit generated basemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offline-basemap.geojson
          if git diff --cached --quiet; then
            echo "Basemap unchanged."
            exit 0
          fi
          git commit -m "Generate R1.6 offline basemap"
          git push origin HEAD:r1.6-offline-basemap
