name: Mission UX CI

on:
  push:
    branches:
      - v29-mission-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Syntax
        run: |
          node --check v28.js
          node --check v28-runtime.js
          node --check v29.js
          node --check v29-ui.js
          node --check v29-storage.js
          node --check v29-stabilize.js
          node --check service-worker.js
          node --check test_v29_stabilize.js
      - name: Regression tests
        run: |
          node test_v28.js
          node test_v28_runtime.js
          node test_v28_integration.js
          node test_v29.js
          node test_v29_integration.js
          node test_v29_stabilize.js
