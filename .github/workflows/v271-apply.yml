name: Apply V27.1 UI patch

on:
  push:
    branches: [v27.1-ui]
    paths:
      - '.github/workflows/v271-apply.yml'
      - 'scripts/v271_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v27.1-ui
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 scripts/v271_patch.py
      - name: Static sanity checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k == 'id' and v: self.ids.append(v)
          p=P(); p.feed(html)
          dup=sorted({x for x in p.ids if p.ids.count(x)>1})
          if dup: raise SystemExit(f'duplicate ids: {dup}')
          if html.count('<script') != html.count('</script>'): raise SystemExit('script tag mismatch')
          if html.count('<style') != html.count('</style>'): raise SystemExit('style tag mismatch')
          if "service-worker.js?v=27.1" not in html: raise SystemExit('service worker registration version not bumped')
          print('HTML static checks passed')
          PY
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(m=>m[1]).filter(s=>s.trim() && !s.includes('window.__reconRotateUnavailable = true'));
          const vm=require('vm');
          for (const [i,s] of scripts.entries()) new vm.Script(s,{filename:`inline-${i}.js`});
          console.log('Inline JS syntax checks passed');
          NODE
      - name: Remove one-shot patch machinery
        run: git rm scripts/v271_patch.py .github/workflows/v271-apply.yml
      - name: Commit patched V27.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git commit -m 'feat: apply V27.1 compact PLAN NAV UX'
          git push origin HEAD:v27.1-ui
