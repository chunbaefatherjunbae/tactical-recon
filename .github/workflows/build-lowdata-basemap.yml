name: Build R1.6 Low Data Basemap

on:
  push:
    branches:
      - r1.6-local-basemap-grid
    paths:
      - '.github/workflows/build-lowdata-basemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: r1.6-local-basemap-grid

      - name: Install OSM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool python3-shapely

      - name: Download South Korea OSM extract
        run: |
          curl -L --fail --retry 3 \
            https://download.geofabrik.de/asia/south-korea-latest.osm.pbf \
            -o /tmp/south-korea.osm.pbf

      - name: Extract low-data features
        run: |
          osmium tags-filter /tmp/south-korea.osm.pbf \
            w/highway=motorway,trunk,primary \
            w/waterway=river,canal \
            n/place=city,town \
            r/admin_level=2 \
            w/natural=coastline \
            -o /tmp/recon-low.osm.pbf --overwrite
          osmium export /tmp/recon-low.osm.pbf \
            -f geojson \
            -o /tmp/recon-low.raw.geojson \
            --overwrite

      - name: Simplify and package RECON basemap
        run: |
          mkdir -p offline
          python3 - <<'PY'
          import json
          from pathlib import Path
          from shapely.geometry import shape, mapping
          from shapely.ops import unary_union, linemerge

          src=Path('/tmp/recon-low.raw.geojson')
          dst=Path('offline/kr-low.geojson')
          raw=json.load(src.open(encoding='utf-8'))

          road_classes=('motorway','trunk','primary')
          roads={k:[] for k in road_classes}
          waters=[]
          coasts=[]
          boundaries=[]
          places=[]

          def safe_shape(feature):
              try:
                  g=shape(feature.get('geometry'))
                  return None if g.is_empty else g
              except Exception:
                  return None

          for f in raw.get('features',[]):
              p=f.get('properties') or {}
              g=safe_shape(f)
              if g is None:
                  continue
              h=p.get('highway')
              if h in roads:
                  roads[h].append(g)
                  continue
              if p.get('waterway') in {'river','canal'}:
                  waters.append(g)
                  continue
              if p.get('natural')=='coastline':
                  coasts.append(g)
                  continue
              if str(p.get('admin_level',''))=='2':
                  boundaries.append(g)
                  continue
              if p.get('place') in {'city','town'}:
                  name=p.get('name:ko') or p.get('name') or p.get('name:en') or ''
                  if not name:
                      continue
                  props={'kind':'place','class':p.get('place'),'name':name}
                  try:
                      if p.get('population') is not None:
                          props['population']=int(str(p.get('population')).replace(',',''))
                  except Exception:
                      pass
                  places.append({'type':'Feature','properties':props,'geometry':mapping(g)})

          def merged_line_feature(kind,cls,geoms,tolerance):
              if not geoms:
                  return None
              merged=unary_union(geoms)
              try:
                  if merged.geom_type in ('MultiLineString','GeometryCollection'):
                      merged=linemerge(merged)
              except Exception:
                  pass
              merged=merged.simplify(tolerance,preserve_topology=False)
              if merged.is_empty:
                  return None
              return {
                  'type':'Feature',
                  'properties':{'kind':kind,'class':cls},
                  'geometry':mapping(merged)
              }

          out=[]
          tolerances={
              'motorway':0.0007,
              'trunk':0.0009,
              'primary':0.0013,
          }
          for cls in road_classes:
              feature=merged_line_feature('road',cls,roads[cls],tolerances[cls])
              if feature: out.append(feature)

          feature=merged_line_feature('water','river',waters,0.0018)
          if feature: out.append(feature)
          feature=merged_line_feature('coast','coastline',coasts,0.0012)
          if feature: out.append(feature)

          if boundaries:
              merged=unary_union(boundaries).simplify(0.0012,preserve_topology=True)
              if not merged.is_empty:
                  out.append({
                      'type':'Feature',
                      'properties':{'kind':'boundary','class':'country'},
                      'geometry':mapping(merged)
                  })

          out.extend(places)

          def quantize(value,digits=5):
              if isinstance(value,float):
                  return round(value,digits)
              if isinstance(value,list):
                  return [quantize(v,digits) for v in value]
              if isinstance(value,tuple):
                  return [quantize(v,digits) for v in value]
              if isinstance(value,dict):
                  return {k:quantize(v,digits) for k,v in value.items()}
              return value

          for feature in out:
              feature['geometry']=quantize(feature['geometry'],4)

          fc={
              'type':'FeatureCollection',
              'name':'TACTICAL RECON South Korea Low Data Basemap',
              'source':'OpenStreetMap via Geofabrik',
              'license':'ODbL 1.0',
              'features':out
          }
          dst.write_text(json.dumps(fc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          print('source counts', {
              'motorway':len(roads['motorway']),
              'trunk':len(roads['trunk']),
              'primary':len(roads['primary']),
              'water':len(waters),
              'coast':len(coasts),
              'boundary':len(boundaries),
              'place':len(places),
          })
          print('packaged features',len(out))
          print('bytes',dst.stat().st_size)
          if dst.stat().st_size > 9_000_000:
              raise SystemExit('low-data basemap is still too large')
          PY

          cat > offline/NOTICE.txt <<'EOF'
          TACTICAL RECON low-data basemap
          Contains information from OpenStreetMap, available under the Open Database License (ODbL).
          Source extract: Geofabrik South Korea.
          https://www.openstreetmap.org/copyright
          https://download.geofabrik.de/asia/south-korea.html
          EOF

      - name: Commit generated basemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/kr-low.geojson offline/NOTICE.txt
          git commit -m "Generate South Korea low-data basemap"
          git push origin HEAD:r1.6-local-basemap-grid
