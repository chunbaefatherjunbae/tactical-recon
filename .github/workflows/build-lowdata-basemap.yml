name: Build Topographic Low Data Basemap

on:
  workflow_dispatch:
  push:
    branches:
      - r2.3.1-ui-lowdata-fix
    paths:
      - .github/workflows/build-lowdata-basemap.yml
      - scripts/build_lowdata_topo.py

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6

      - name: Install geodata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool gdal-bin
          python3 -m pip install --disable-pip-version-check numpy pillow shapely rasterio

      - name: Check builder syntax
        run: python3 -m py_compile scripts/build_lowdata_topo.py

      - name: Download South Korea OSM extract
        run: |
          curl -L --fail --retry 3 \
            https://download.geofabrik.de/asia/south-korea-latest.osm.pbf \
            -o /tmp/south-korea.osm.pbf

      - name: Extract field-map OSM features
        run: |
          osmium tags-filter /tmp/south-korea.osm.pbf \
            w/highway=motorway,trunk,primary,secondary \
            w/waterway=river,canal \
            n/place=city,town,village \
            n/natural=peak \
            w/natural=water \
            r/natural=water \
            w/water=reservoir \
            r/water=reservoir \
            r/admin_level=2 \
            w/natural=coastline \
            -o /tmp/recon-topo.osm.pbf --overwrite
          osmium export /tmp/recon-topo.osm.pbf \
            -f geojson \
            -o /tmp/recon-topo.raw.geojson \
            --overwrite

      - name: Build topographic field basemap
        run: python3 scripts/build_lowdata_topo.py

      - name: Write attribution notice
        run: |
          cat > offline/NOTICE.txt <<'EOF'
          TACTICAL RECON topographic low-data basemap

          Map / feature data:
          Contains information from OpenStreetMap, available under the Open Database License (ODbL).
          Source extract: Geofabrik South Korea.
          https://www.openstreetmap.org/copyright
          https://download.geofabrik.de/asia/south-korea.html

          Terrain / contour data:
          Contours are derived from Mapzen Terrain Tiles distributed through the AWS Open Data Registry.
          Terrain Tiles aggregate multiple regional elevation sources; source-specific attribution applies.
          https://registry.opendata.aws/terrain-tiles/
          https://github.com/tilezen/joerd/blob/master/docs/attribution.md
          https://github.com/tilezen/joerd/blob/master/docs/data-sources.md
          EOF

      - name: Commit generated basemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline/kr-low.geojson offline/NOTICE.txt
          if git diff --cached --quiet; then
            echo "Basemap is already current."
            exit 0
          fi
          git commit -m "Refresh topographic South Korea low-data basemap"
          git push origin HEAD:${GITHUB_REF_NAME}
