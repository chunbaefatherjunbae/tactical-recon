name: UI browser regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-ui-browser.cjs
      - run: node scripts/test-baseline-browser.cjs
      - name: Publish BASELINE test branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'rebuild/baseline'
        run: git push origin HEAD:refs/heads/baseline-test --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            ui-results/
            ui-results-baseline/
