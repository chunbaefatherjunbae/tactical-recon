name: UI browser regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-ui-browser.cjs
      - run: node scripts/test-baseline-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-results
          path: |
            ui-results/
            ui-results-baseline/
