name: Deploy Tactical Recon to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Syntax check
        run: |
          node --check location-core.js
          node --check app-base.js
          node --check v28.js
          node --check v28-runtime.js
          node --check v29.js
          node --check v29-ui.js
          node --check v29-storage.js
          node --check r1.js
          node --check r2.js
          node --check service-worker.js
          node --check test_r1.js
          node --check test_r2.js

      - name: Test V28
        run: node test_v28.js

      - name: Test V28 runtime
        run: node test_v28_runtime.js

      - name: Test V28 integration
        run: node test_v28_integration.js

      - name: Test V29
        run: node test_v29.js

      - name: Test V29 integration
        run: node test_v29_integration.js

      - name: Test coordinate parser
        run: node test_location_core.js

      - name: Test R1
        run: node test_r1.js

      - name: Test R2
        run: node test_r2.js

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
