name: Deploy Tactical Recon to GitHub Pages

on:
  push:
    branches:
      - main
      - r1-structure-overhaul
      - r1.1-ui-polish
      - r1.2-reticle-layout
      - r1.3-field-search
      - r1.4-visual-correction
      - r1.4.1-mobile-reticle
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Syntax check
        run: |
          node --check v28.js
          node --check v28-runtime.js
          node --check v29.js
          node --check v29-ui.js
          node --check v29-storage.js
          node --check v29-stabilize.js
          node --check r1.js
          node --check service-worker.js
          node --check test_v29_stabilize.js
          node --check test_r1.js

      - name: Run regression tests
        run: |
          node test_v28.js
          node test_v28_runtime.js
          node test_v28_integration.js
          node test_v29.js
          node test_v29_integration.js
          node test_r1.js

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
